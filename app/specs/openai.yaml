openapi: 3.0.0
info:
  title: Weather App API
  description: This API allows users to search for locations across the US by city or airport name for weather forecast information lookup.
  version: "1.0.1"
servers:
  - url: http://localhost:3000/api/v1
paths:
  /locations/search:
    get:
      summary: Search for locations by name
      description: Searches for locations by city or airport name and returns detailed information about each matching location.
      operationId: searchLocations
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: The city or airport name to search for.
      responses:
        '200':
          description: A list of locations matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
        '400':
          description: Missing or invalid query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No locations found matching the search query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An unexpected error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /forecast/week:
    get:
      summary: Get 7-day weather forecast
      description: Returns a 7-day weather forecast for a given latitude and longitude.
      operationId: getWeeklyForecast
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            type: number
            format: double
          description: Latitude of the location.
        - in: query
          name: longitude
          required: true
          schema:
            type: number
            format: double
          description: Longitude of the location.
        - in: query
          name: units
          required: false
          schema:
            type: string
            enum:
              - metric
              - imperial
            default: metric
          description: Units for temperature (metric or imperial).
      responses:
        '200':
          description: A 7-day weather forecast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: External weather service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Location:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - City
            - Airport
        state:
          type: string
        country:
          type: string
          default: "USA"
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        airportCode:
          type: string
          nullable: true
    LocationsResponse:
      type: object
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/Location'
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
    ForecastResponse:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        units:
          type: string
        forecast:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              weather_code:
                type: integer
              temperature:
                type: object
                properties:
                  max:
                    type: number
                  min:
                    type: number
